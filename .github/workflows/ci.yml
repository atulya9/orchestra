name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the stock Bash 3.2 the script must stay compatible with.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck jq
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core shellcheck jq
      - name: shellcheck
        run: shellcheck -S warning bin/orchestra install.sh
      - name: bats
        run: bats tests/
