# Overrides when Antigravity (agy) is the lead (falls back to ../models.conf for anything not set here).
# Lead roles use Antigravity's subagent model names: flash_lite | flash | pro | inherit.
lead.explore   = flash
lead.task      = pro

# agy/<model> entries run as native subagents by default (set `subagent = off` to use the agy CLI).
# To also route a model configured under another CLI to a native agy subagent, map it here:
#   native.claude/sonnet = <agy-subagent-model>
# To force a specific agy/<model> through the CLI instead of a subagent:
#   native.agy/<model> = off
