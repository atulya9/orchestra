# Orchestra model routing.
#   role = kind/model[#effort][, fallback, ...]   -> the first model that works wins.
#   kind: claude/, codex/, grok/, agy/ drive that vendor's CLI; anything else is an OpenCode
#         provider/model (see: opencode models).
#   effort: any level the model supports (low | medium | high | xhigh | max ...); "#max" = the
#           highest it offers; no suffix = the CLI's default.
#
# Set roles here or with:  orchestra models set <role> <model1,model2>
# Overrides, first match wins: <repo>/.orchestra/models.conf (one repo, --project), then
# harness/<lead>.conf next to this file (one lead agent, --harness), then this file.
# Check that every model and effort exists:  orchestra models doctor
#
# Uncomment and adapt the lines for the CLIs you have. A reviewer is never the author's model,
# so give `review` at least two models, or use two different vendors for review and review2.

# ---- Worker roles ----
# Mechanical work: tests, docs, boilerplate. Don't route private code here if it's a free/third-party model.
# cheap    = claude/haiku
# Real features and multi-file changes.
# build    = claude/sonnet#high, codex/<model>#high
# Code review (first pass) and an optional second reviewer from another vendor.
# review   = claude/opus, codex/<model>#high
# review2  = agy/<model>
# Large read-only questions: whole modules, long logs.
# research = claude/sonnet

# ---- Lead agent roles ----
# For the lead agent's own subagents, in its own model names. They differ per lead, so set them in
# harness/<lead>.conf (see harness/claude.conf).

# Where workers (and their setup/tests) run:
#   docker = container: repo read-only, only the task's worktree writable (needs Docker running)
#   host   = directly on this machine, with your own CLI logins
# The lead's own models skip this: Claude Code uses its subagents, other leads their own CLI on the host.
runtime  = docker
# Minutes a worker run may take before it is stopped (default 45).
# timeout  = 45
